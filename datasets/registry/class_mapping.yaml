# Class Mapping — E-OVRT-VDP Vocabulary v2
#
# Canonical detection classes:
# - person: full body of person/worker
# - helmet: safety helmet (the equipment), tight bbox around helmet
# - vest: reflective/safety vest (the equipment), tight bbox around torso
# - bare_head: head without helmet (from explicit negatives only, not derived from absence)
#
# BENCH-only attributes (person-level, from explicit annotations):
# - has_helmet: binary attribute per person (true/false)
# - has_vest: binary attribute per person (true/false)
#
# NOTE: no_helmet and no_vest are NO LONGER detection classes (v2 change).
# See section 3 of design spec (2026-06-17-reinicio-seleccion-datasets-design.md).
#
# Dataset selection and role assignment determined by
# datasets/registry/selection_scoring.csv and
# datasets/registry/annotation_contract_v2.yaml.

detection_classes:
  person:
    description: "Cuerpo completo visible de la persona/trabajador (incluye cabeza)."
  helmet:
    description: "El casco propiamente dicho (la prenda), caja ceñida al casco."
  vest:
    description: "El chaleco reflectivo/de seguridad (la prenda), caja ceñida al torso."
  bare_head:
    description: |
      Cabeza descubierta de persona SIN casco.
      Solo desde etiquetas negativas explícitas (ej. NO-Hardhat anotado).
      Nunca derivado por resta head - helmet.
      Mutuamente excluyente con helmet sobre la misma cabeza.

bench_attributes:
  description: |
    Person-level attributes, constructed from explicit negative annotations.
    Used only in the BENCH ground truth (evaluation baseline).
    Enables measuring approaches E3 (negation by prompt).
  has_helmet:
    description: |
      True if person has helmet annotation or associated helmet detection.
      False only if explicit NO-Hardhat / NO-Helmet negative annotation.
      Required for CR-01 (no helmet) risk evaluation.
  has_vest:
    description: |
      True if person has vest annotation or associated vest detection.
      False only if explicit NO-Vest / NO-Safety-Vest negative annotation.
      Required for CR-02 (no vest) risk evaluation.

dataset_mappings:
  # Source class → canonical detection class mapping
  # See datasets/registry/selection_scoring.csv for decision rationale.
  # NOTA: las anotaciones "rol: ..." son HISTÓRICAS — los roles TRAIN/BENCH/DEMO
  # fueron archivados el 2026-08-15 (ver datasets/splits/DEPRECATED.md).
  # Fuente de verdad del mapeo: configs() en datasets/scripts/convert/convert_datasets.py.

  construction_site_safety:  # rol: TRAIN + BENCH (histórico)
    person: ["Person"]
    helmet: ["Hardhat"]
    vest: ["Safety Vest"]
    bare_head: ["NO-Hardhat"]

  chv:  # rol: TRAIN (histórico)
    person: ["person"]
    helmet: ["blue helmet", "red helmet", "white helmet", "yellow helmet"]
    vest: ["vest"]
    bare_head: []  # ausente per contract

  ppe_siabar:  # rol: TRAIN (histórico)
    person: ["Person"]
    helmet: ["Helmet"]
    vest: ["Vest"]
    bare_head: []  # ausente per contract

  shel5k:  # fuente canonical_v2 + estrato de bench_v3 (reingresó 2026-07-23, doc 66)
    # Copiado fielmente de configs() en convert_datasets.py (canonical_v2_map);
    # pinneado por datasets/tests/test_shel5k_mapping.py.
    person: ["person", "person_with_helmet", "person_no_helmet"]
    helmet: ["helmet"]
    vest: []  # SHEL5K no anota chaleco
    # `head` es la anotación EXPLÍCITA de cabeza descubierta del paper (82% contenida
    # en person_no_helmet, 2% en person_with_helmet; existe head_with_helmet aparte):
    # cumple el contrato D9 vía bare_head_explicit_sources — verificado sobre 400 XML.
    bare_head: ["head"]
    # NO mapeadas: head_with_helmet (solapa 97% con una caja `helmet` separada —
    # mapearla duplicaría el GT) y face.

  construction_safety_hardhat:  # DESCARTADO (2026-06-17: URL de Kaggle inválida, nunca descargado)
    person: ["person"]
    helmet: ["helmet"]
    vest: ["vest"]  # parcial per contract
    bare_head: ["no-helmet"]

  # Discarded candidates (kept for auditability):
  discarded_mocs:
    person: ["Worker"]
    helmet: []
    vest: []
    bare_head: []

  discarded_construction_ppe_skcet:
    person: ["person"]
    helmet: ["helmet"]
    vest: ["vest"]
    bare_head: ["no hat"]  # parcial; dataset discarded due to 55% defect rate

split_policy:
  seed: 42
  # HISTÓRICO: el esquema by_role (TRAIN/BENCH/DEMO) fue retirado — los manifiestos
  # de rol se archivaron el 2026-08-15 en legacy/splits/v2/ (superados por bench_v3 /
  # finetuning_v1 / catálogo del media-plane; ver datasets/splits/DEPRECATED.md).
  by_role:
    train:
      proportion: 0.70
    bench:
      proportion: 0.15
      held_out: true
      description: "Held-out from TRAIN; no shared images/scenes (leakage control, spec §5, D13)."
    demo:
      proportion: 0.15
      description: "High-quality subset for thesis defense; privacy-blurred if needed."
  constraints:
    - "TRAIN, BENCH held-out (disjoint images/scenes)"
    - "BENCH congelado antes de evaluación"
    - "no data augmentation sobre BENCH/DEMO"
    - "deduplicación perceptual antes del split"
    - "mantener trazabilidad imagen → dataset origen"
    - "balance de clases: mínimo 150 instancias por clase en TRAIN (spec §7.1)"
    - "poder estadístico BENCH: ≥150 violadores + ≥150 no-violadores por condición (spec §6.5)"

deprecated:
  description: |
    DEPRECATED (v1 schema, not deleted yet):
    - no_helmet: moved from detection class to evaluation attribute (has_helmet).
    - no_vest: moved from detection class to evaluation attribute (has_vest).

    Motivation: no_helmet/no_vest were noisy in v1 (derived from generic head/face,
    violating the rule "bare_head only from explicit negatives").

    v2 approach:
    - Detection trains only on positive classes (person/helmet/vest/bare_head).
    - BENCH GT includes has_helmet/has_vest attributes for evaluation.
    - Enables three comparative experiments (E1 spatial logic, E2 visual bare_head, E3 negation prompts).

    See design spec §3, D6, D9, D10.

  old_views:
    - "canonical_cr01_cr02 — DEPRECATED, vistas CR-01/CR-02 (v1)"
    - "finetuning_cr01_cr02 — DEPRECATED, fine-tuning subset con clases ruidosas (v1)"

  old_fine_tuning_config: |
    The legacy fine_tuning_subset (min/max images, CR-01/CR-02 conditions)
    is not used in v2. Replaced by role-based split (TRAIN/BENCH/DEMO) and
    per-condition GT attributes (has_helmet/has_vest) in evaluation.
