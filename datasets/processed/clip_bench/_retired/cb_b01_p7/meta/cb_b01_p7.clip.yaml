# Metadata del clip del banco (spec video-gt-lab §4.2 / spec 43 §4).
# GT PRELIMINAR: la correccion del XML la hizo revision VISUAL asistida
# (crops por track, sin pasada frame a frame en CVAT). Sirve para el
# bring-up de la plataforma y las pruebas iniciales; la reemplaza la
# correccion humana controlada del usuario en CVAT.

clip_id: cb_b01_p7

# Bloque B = obra real (no guionado). LICENCIA/CONSENTIMIENTO: registrar en
# registry/license_registry.md antes de usarlo en resultados reportables
# (spec 43 §7) — pendiente.
block: B

# P7 = multi-persona (~10-12 operarios, plano general, maquinaria cruzando).
scenario: P7

# scene = episodios escena-condicion (G0), el nivel que matchea el motor de
# alertas. La variante subject-level (G1-demo cualitativa) queda para la
# pasada controlada en CVAT.
level: scene

# Identidad que el evaluador matchea contra las alertas
# (alert.source_id == episode.source_id); la corrida del bench configura su
# fuente con este id (ingest.config.source_id).
source_id: cb_b01_p7

recording:
  resolution: 1920x1080
  distance_band_m: ">20"     # plano general elevado
  lighting: natural          # exterior, dia
  occlusion: medium          # rodillo y cargadora cruzan delante de los operarios

annotation:
  annotator: claude-vision-preliminary   # PRELIMINAR — pendiente correccion humana en CVAT
  double_annotated: false
