recording:
  resolution: 1920x1080
  lighting: diurna   # verificado sobre frames 492/618/690 del clip

annotation:
  annotator: simon          # correccion humana en CVAT (task 13), 2026-07-21/2026-08-07
  double_annotated: false
  second_annotator: null
  kappa: null

  # REVISION VISUAL DEL TRACK 0, 2026-08-07 (el sujeto del ex-episodio CR-01).
  # El track entra en el frame 492 y sale en el 706 (con un hueco de outside en
  # 659-671); es el UNICO track del export que aparece en el frame 492, que es como
  # el anotador lo identifico ("person 3" en la UI de CVAT — el numero de la UI no
  # viaja en el XML, el ancla de identidad es el frame de aparicion).
  #
  # Lo que se ve: el operador SENTADO EN LA CABINA de la excavadora, filmado a traves
  # del vidrio y con el marco de la cabina cruzandole la cabeza.
  #   - CHALECO: naranja fluor, claramente visible en el tramo despejado (frames
  #     492 y 618 revisados) => el 'false' original fue ERROR DE ANOTACION, no
  #     incertidumbre. Se corrige a 'true' en todo el track: la identidad del sujeto
  #     es continua (mismo asiento, misma maquina) y nadie se saca el chaleco
  #     mientras opera.
  #   - CASCO: NO determinable en ningun frame (marco de la cabina + reflejo del
  #     vidrio + el brazo tapandole la cabeza). El export traia 'false' en 190 cajas
  #     y 'true' en 12 (frames 612-623): las dos son conjeturas. Se resuelve a
  #     'unknown' en todo el track, que es la respuesta correcta cuando el estado no
  #     se puede juzgar (frontera de juzgabilidad, doc 106; "la incertidumbre nunca
  #     fabrica una violacion", y tampoco fabrica un cumplimiento).
  #
  # CONSECUENCIA ASUMIDA: el clip pierde su unico episodio y pasa a NEGATIVO. El
  # episodio perdido duraba 4.000 ms EXACTOS — habria entrado al banco como el
  # positivo mas fragil que tiene (un frame menos de conjetura y no existia), asi
  # que sacarlo endurece el banco en vez de ablandarlo.
  #
  # Se usa attribute_corrections (pisa valores explicitos del anotador, con
  # previous_value verificado) y NO unknown_adjudications, que por diseno se niega a
  # pisarlos. Son CUATRO entradas y no dos porque el guard de deriva exige que
  # previous_value coincida caja por caja: has_helmet venia partido en tres tramos
  # (false / true / false) y cada tramo necesita su declaracion firmada.
  attribute_corrections:
  - track_id: 0             # obligatorio: la correccion es de UNA persona
    attr: has_vest
    from_frame: 492
    to_frame: 706
    previous_value: 'false'
    value: 'true'
    decided_by: simonll4
    decided_at: '2026-08-07'
    rationale: >-
      Operador en la cabina de la excavadora: chaleco naranja de alta visibilidad
      claramente visible a traves del vidrio (frames 492 y 618 revisados en el
      video). El 'false' del export fue error de anotacion. Se extiende a todo el
      track por continuidad de identidad del sujeto (mismo asiento, misma maquina,
      track unico con un hueco de outside de 13 frames).
  - track_id: 0
    attr: has_helmet
    from_frame: 492
    to_frame: 611
    previous_value: 'false'
    value: 'unknown'
    decided_by: simonll4
    decided_at: '2026-08-07'
    rationale: >-
      Casco NO determinable: el marco de la cabina y el reflejo del vidrio tapan la
      cabeza del operador. El 'false' era conjetura y era ademas el unico sosten del
      episodio CR-01 de 4.000 ms. 'unknown' es el estado correcto para lo que no se
      puede juzgar.
  - track_id: 0
    attr: has_helmet
    from_frame: 612
    to_frame: 623
    previous_value: 'true'
    value: 'unknown'
    decided_by: simonll4
    decided_at: '2026-08-07'
    rationale: >-
      Mismo motivo que el tramo anterior, con el signo opuesto: estos 12 frames
      (400 ms) venian marcados 'true'. La cabeza tampoco se ve aca, asi que el
      'true' era la conjetura simetrica del 'false'. Se unifica en 'unknown' para
      que el track entero diga lo mismo: no evaluable.
  - track_id: 0
    attr: has_helmet
    from_frame: 624
    to_frame: 706
    previous_value: 'false'
    value: 'unknown'
    decided_by: simonll4
    decided_at: '2026-08-07'
    rationale: >-
      Tramo final del track (incluye el hueco de outside 659-671, sin cajas). Misma
      causa que los dos tramos anteriores: cabeza tapada por la cabina, estado no
      determinable.
