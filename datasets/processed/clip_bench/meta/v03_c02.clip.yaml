# Lote de internet (doc 58 §B.2.1): obra real en cumplimiento, mini-soak sin
# cortes de escena verificados.
# El clip ES el master SIN RECORTAR (doc 59 §6): se usa entero como material
# negativo. NO regenerar desde la consola.
#
# GT HUMANO 2026-08-07 (CVAT task 13), CON UNA CORRECCION FIRMADA:
#   Derivacion cruda del export -> 1 episodio CR-01 16.400 -> 20.400 ms (4.000 ms
#   EXACTOS, justo en el umbral de confirmacion) + 7 eventos sub-umbral.
#   Ese episodio lo sostenia UN SOLO track: el operador SENTADO EN LA CABINA de la
#   excavadora (track 0 del export, "person 3" en la UI de CVAT, entra en cuadro en
#   el frame 492). Revision visual (ver annotation.attribute_corrections): lleva
#   chaleco naranja de alta visibilidad claramente visible, y la cabeza queda tapada
#   por el marco/vidrio de la cabina => has_vest era 'false' por ERROR y has_helmet
#   no es determinable.
# RESULTADO VIGENTE: **NEGATIVO** — 0 episodios, 3 eventos sub-umbral
#   (CR-02 800 ms en 21.500-22.300 del track 1; CR-01 y CR-02 de 33 ms en t=0 de un
#   track residual de 1 caja). Ninguno debe alertar.
#
# NO ES SOAK: dura 104.900 ms (1:44,9) y el criterio de soak exige un negativo
# continuo de >=5 min (doc 57 §3.2 G1). Aporta 0,0291 h de tiempo negativo
# INFORMATIVO (no entra al denominador de FAR/hora, que sigue siendo el soak
# v06_c01 = 0,1027 h) y sirve como control de falsos positivos sobre obra real:
# cualquier alerta de una campana sobre este clip es un FP con causa auditable.
clip_id: v03_c02
block: B          # obra real, no guionado
scenario: P5      # cumplimiento total (negativo) — CONFIRMADO por el GT humano
source_id: v03_c02
level: scene
master: raw/3.2.mp4

