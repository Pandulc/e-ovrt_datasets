  channel_url: "https://www.youtube.com/@HospitalConstruction"
  terms: "Standard YouTube License — uso academico/evaluativo con cita, sin redistribucion"
  video_url: TODO   # URL + fecha de acceso del video fuente (raw/6.1.mp4)

recording:
  resolution: 1920x1080
  lighting: diurna

annotation:
  annotator: simon          # correccion humana en CVAT (task 18), 2026-07-21/2026-08-06
  double_annotated: false
  second_annotator: null
  kappa: null

  # REVISION VISUAL DEL TRACK 110, 2026-08-06 (el sujeto del ex-episodio CR-02).
  # Se miraron en CVAT los tres tramos que la auditoria habia marcado (doc 102 §2.3):
  #
  #   (1) f9935-10205  has_vest=unknown  -> CONFIRMADO CORRECTO. "Esta justo a un
  #       costado y no se puede diferenciar bien el vest" (borde izquierdo del
  #       plano, caja de 70-80 px de alto). NO se adjudica: la incertidumbre es real.
  #   (2) f10207-10271 has_vest=unknown  -> CONFIRMADO CORRECTO. "Esta detras de
  #       unas rejas y no se ve bien". NO se adjudica.
  #   (3) f10272-10665 has_vest=false    -> ERROR DE ANOTACION. La persona SI lleva
  #       chaleco. Se corrige a true (ver attribute_corrections).
  #
  # (1) y (2) quedan como evidencia de la frontera de juzgabilidad, no como huecos
  # a tapar: el anotador no pudo determinar el estado y esa es la respuesta correcta.
  attribute_corrections:
  - track_id: 110           # obligatorio: la correccion es de UNA persona
    attr: has_vest
    from_frame: 10272
    to_frame: 10665
    previous_value: 'false'
    value: 'true'
    decided_by: simonll4
    decided_at: '2026-08-06'
    rationale: >-
      Revision visual en CVAT del track 110 en su tramo plenamente visible (cruza
      todo el plano, caja de ~215 px de alto): la persona SI lleva chaleco. El
      'false' original fue error de anotacion, no incertidumbre — por eso se
      corrige con attribute_corrections (que pisa un valor explicito, con
      previous_value verificado) y NO con unknown_adjudications, que por diseno se
      niega a pisar valores del anotador. CONSECUENCIA ASUMIDA CON PLENO
      CONOCIMIENTO: el clip pierde su unico episodio CR-02 y pasa a NEGATIVO, con
      lo que se vuelve el PRIMER clip soak del banco (6:09,6 continuos = 0,1027 h)
      y habilita por primera vez un FAR/hora medido sobre obra real.
      FUENTE DE VERDAD (decision del usuario, 2026-08-09): **la anotacion versionada
      en este repo**, NO el estado de CVAT. Un re-export de CVAT que no traiga esta
      correccion la revertiria en silencio; para eso existe el guard
      `apply_attribute_corrections.py --check` (ver registry §2.2).
