# SOAK PRINCIPAL DEL BANCO (doc 58 §B.2.1): toma CONTINUA de 6:10, con 0 cortes
# de escena verificados.
#
# El clip ES el master SIN RECORTAR (doc 59 §6). Recortarlo destruiria justamente
# lo que lo hace valioso: la ventana continua de tiempo negativo.
# NO regenerar desde la consola.
#
# GT HUMANO 2026-08-06, EN DOS PASADAS (doc 108):
#   1a pasada -> 1 episodio CR-02 (342.400-355.533 ms) => el clip era P2, positivo.
#   2a pasada (revision visual del track 110, ver annotation) -> ese 'false' era
#   ERROR DE ANOTACION: la persona lleva chaleco. Corregido con firma.
# RESULTADO VIGENTE: **NEGATIVO** — 0 episodios, 35 eventos sub-umbral.
#
# Con eso el clip cumple la definicion de SOAK (negativo de >=5 min, doc 57 §3.2 G1)
# y es el PRIMERO del banco: aporta 369.567 ms = 0,1027 h de tiempo de cumplimiento
# anotado sobre obra real. Es el unico denominador temporal que el banco tiene.
clip_id: v06_c01
block: B          # obra real, no guionado
scenario: P5      # cumplimiento total (negativo) — CONFIRMADO tras la correccion
source_id: v06_c01
level: scene
master: raw/6.1.mp4

# LICENCIA (registry/license_registry.md, seccion "Material de VIDEO"): escena
# del canal publico de YouTube @HospitalConstruction (Standard YouTube License,
