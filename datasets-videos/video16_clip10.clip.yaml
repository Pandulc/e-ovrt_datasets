# Metadata del clip del banco (spec video-gt-lab §4.2 / spec 43 §4).
# STUB generado automaticamente junto con la pre-anotacion (etapa 0/1).
# COMPLETAR block/scenario/recording a mano antes de la derivacion (etapa 3);
# la derivacion falla con error claro si block/scenario/level quedan invalidos.

clip_id: video16_clip10

# PROVISIONAL (test de mecanica, 2026-07-18): valores para verificar el pipeline
# GT->corrida->evaluacion. Corregir con los reales antes de promover al banco.
block: B

# PROVISIONAL: corregir con el codigo de escenario real (ver registry/).
scenario: P7

# scene = episodios escena-condicion (G0, el nivel que matchea el motor de alertas).
# subject = variante subject-level (G1), requiere subject_key por episodio.
level: scene

# Identidad que el evaluador matchea contra las alertas (alert.source_id ==
# episode.source_id); default = clip_id, dejar salvo que la corrida del bench
# use otro source_id explicito.
source_id: video16_clip10

