# Revisión dirigida del GT del rodaje (2026-10) — especificación de los casos
#
# Qué es: los casos del banco temporal donde dos registros humanos no coinciden o la
# anotación tiene una señal estructural de error. Se seleccionaron con criterios que NO
# miran la salida del modelo (ni alertas ni métricas):
#   (1) inicio del episodio en el GT a más de 0,5 s de la marca del operador en la ficha
#       del rodaje (4 clips: a_p2_c01, a_p2_c02, a_p7_c02, a_p9_c08);
#   (2) cantidad de episodios distinta entre la ficha y el GT (a_p1_c05, a_p7_c03);
#   (3) cambio de atributo de menos de 1,5 s dentro de una infracción (a_p1_c05, a_p2_c05,
#       a_p7_c03, a_p8_c01);
#   (4) trayectoria que termina y otra que empieza a menos de 3 s y cerca, alrededor de
#       una infracción, o caja suelta sin cerrar (a_p7_c02, a_p7_c03, a_p8_c01).
# Escaneados también, sin efecto sobre ningún episodio (no se preguntan): a_p4_c02,
# a_p5_c01 y a_p9_c06 (cajas de un cuadro al entrar o salir de cuadro).
#
# La vista NO muestra el valor anotado hoy, las alertas, las métricas ni la ficha.
# Herramientas: datasets/scripts/videogt/revision/{preparar.py,servidor.py,pagina.html}.
# Las respuestas se convierten en correcciones firmadas en cada <clip>.clip.yaml
# (attribute_corrections / identity_corrections) y se re-deriva el GT.

revision: revision-dirigida-2026-10
fps: 30

opciones:
  casco:
    - {k: puesto, t: "Lo lleva puesto"}
    - {k: no_puesto, t: "No lo lleva"}
    - {k: tapado, t: "Tapado un momento (sigue igual)"}
    - {k: no_se_sabe, t: "No se puede saber"}
  chaleco:
    - {k: puesto, t: "Lo lleva puesto"}
    - {k: no_puesto, t: "No lo lleva"}
    - {k: tapado, t: "Tapado un momento (sigue igual)"}
    - {k: no_se_sabe, t: "No se puede saber"}
  entrada:
    - {k: fuera, t: "No está en cuadro"}
    - {k: sin_cabeza, t: "Está, pero no se le ve la cabeza"}
    - {k: no_puesto, t: "Se le ve la cabeza: sin casco"}
    - {k: puesto, t: "Se le ve la cabeza: con casco"}
    - {k: no_se_sabe, t: "No se puede saber"}
  quien:
    - {k: P, t: "P"}
    - {k: Q, t: "Q"}
    - {k: otra, t: "Otra persona"}
    - {k: no_se_sabe, t: "No se distingue"}
  identidad:
    - {k: P, t: "P"}
    - {k: Q, t: "Q"}
    - {k: otra, t: "Otra persona"}
    - {k: no_persona, t: "No es una persona"}
    - {k: cambia, t: "Cambia de persona dentro de la caja"}
    - {k: no_se_sabe, t: "No se distingue"}

casos:
  - id: c1
    clip: a_p7_c02
    persona_p: 607        # para el conversor: trayectoria principal de P y de Q
