      letra a lo largo del clip. Mirá los videos y respondé solo por lo que ves.
    referencias:
      - {titulo: "Persona P", track: 607, frames: [45, 150]}
      - {titulo: "Persona Q", track: 606, frames: [300]}
    videos:
      - {titulo: "6 a 14 s", desde_ms: 2500, hasta_ms: 14000}
